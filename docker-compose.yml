services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: salonos-app:local
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "127.0.0.1:8515:8080"
    volumes:
      - salonos_storage:/var/www/html/storage
      - salonos_bootstrap_cache:/var/www/html/bootstrap/cache
      - salonos_service_images:/var/www/html/public/images/services
      - salonos_settings_images:/var/www/html/public/images/settings
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/up >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - salonos_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql-test
      DB_PORT: 3306
      DB_DATABASE: jarvis_salon_testing
      DB_USERNAME: salonos_test
      DB_PASSWORD: salonos_test_only
      DB_URL: ""
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    depends_on:
      mysql-test:
        condition: service_healthy
    networks:
      - test

  mysql-test:
    profiles: ["test"]
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: jarvis_salon_testing
      MYSQL_USER: salonos_test
      MYSQL_PASSWORD: salonos_test_only
      MYSQL_ROOT_PASSWORD: salonos_test_root_only
    tmpfs:
      - /var/lib/mysql
    networks:
      - test
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

networks:
  test:
    name: salonos-test-isolated
    internal: true

volumes:
  salonos_mysql:
  salonos_storage:
  salonos_bootstrap_cache:
  salonos_service_images:
  salonos_settings_images:
