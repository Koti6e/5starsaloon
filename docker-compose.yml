services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: salonos-app:local
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "127.0.0.1:8515:8080"
    volumes:
      - salonos_storage:/var/www/html/storage
      - salonos_bootstrap_cache:/var/www/html/bootstrap/cache
      - salonos_service_images:/var/www/html/public/images/services
      - salonos_settings_images:/var/www/html/public/images/settings
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/up >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - salonos_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  salonos_mysql:
  salonos_storage:
  salonos_bootstrap_cache:
  salonos_service_images:
  salonos_settings_images:
